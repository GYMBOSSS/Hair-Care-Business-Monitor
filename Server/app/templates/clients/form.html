{% extends "base.html" %}

{% block title %}{{ 'Редактирование' if client else 'Новый клиент' }}{% endblock %}

{% block content %}
<h1>{{ 'Редактирование клиента' if client else 'Новый клиент' }}</h1>

<form method="post">
    <div class="mb-3">
        <label for="name" class="form-label">Имя *</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ client.name if client else '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="phone" class="form-label">Телефон *</label>
        <input type="tel" class="form-control" id="phone" name="phone" 
           value="{{ client.phone if client else '' }}"
           placeholder="+7 (999) 123-45-67"
           pattern="[\+\d\s\(\)-]{10,20}"
           required>
        <small class="text-muted">Формат: +7 999 123-45-67 или 89991234567</small>
    </div>
    
    <div class="mb-3">
        <label for="comment" class="form-label">Комментарий / Доп. информация</label>
        <input type="text" class="form-control" id="comment" name="comment" 
            value="{{ client.comment if client else '' }}" 
            placeholder="Например: предпочтения, скидка, особые пожелания">
        <small class="text-muted">Любая дополнительная информация о клиенте</small>
    </div>
    
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('clients.index') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
