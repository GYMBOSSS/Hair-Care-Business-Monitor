{% extends "base.html" %}

{% block title %}{{ 'Редактирование' if client else 'Новый клиент' }}{% endblock %}

{% block content %}
<h1>{{ 'Редактирование клиента' if client else 'Новый клиент' }}</h1>

<form method="post">
    <div class="mb-3">
        <label for="name" class="form-label">Имя *</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ client.name if client else '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="phone" class="form-label">Телефон *</label>
        <input type="text" class="form-control" id="phone" name="phone" value="{{ client.phone if client else '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="car_info" class="form-label">Автомобиль</label>
        <input type="text" class="form-control" id="car_info" name="car_info" value="{{ client.car_info if client else '' }}">
    </div>
    
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('clients.index') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
