{% extends "base.html" %}

{% block title %}Нет бизнеса{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-4">Добро пожаловать!</h1>
    <p class="lead">Вы зарегистрировались как сотрудник.</p>
    <p class="mb-4">Чтобы начать работу, вступите в существующий бизнес.</p>
    
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="d-grid gap-3">
                <a href="{{ url_for('auth.join_business') }}" class="btn btn-primary btn-lg">
                    🔍 Найти бизнес
                </a>
                <a href="{{ url_for('auth.my_invites') }}" class="btn btn-outline-secondary btn-lg">
                    📋 Мои заявки
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
