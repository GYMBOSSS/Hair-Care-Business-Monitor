{% extends "base.html" %}

{% block title %}{{ 'Редактирование' if service else 'Новая услуга' }}{% endblock %}

{% block content %}
<h1>{{ 'Редактирование услуги' if service else 'Новая услуга' }}</h1>

<form method="post">
    <div class="mb-3">
        <label for="name" class="form-label">Название *</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ service.name if service else '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="price" class="form-label">Цена (₽) *</label>
        <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ service.price if service else '' }}" required>
    </div>
    
    <div class="mb-3">
        <label for="duration_minutes" class="form-label">Длительность (минуты) *</label>
        <input type="number" class="form-control" id="duration_minutes" name="duration_minutes" value="{{ service.duration_minutes if service else '' }}" required>
    </div>
    
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('services.index') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
